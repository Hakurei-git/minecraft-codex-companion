plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base { archivesName = "${mod_id}-forge-${minecraft_version}" }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    windowFocusAgent {
        java.srcDir '../../apps/portable-launcher/window-focus-agent/src/main/java'
    }
    windowFocusAgentTest {
        java.srcDir '../../apps/portable-launcher/window-focus-agent/src/test/java'
        compileClasspath += sourceSets.windowFocusAgent.output
        runtimeClasspath += sourceSets.windowFocusAgent.output
    }
}

configurations {
    windowFocusAgentLwjgl331 { transitive = false }
    windowFocusAgentLwjgl333 { transitive = false }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    windowFocusAgentImplementation 'org.ow2.asm:asm:9.7'
    windowFocusAgentTestImplementation 'org.ow2.asm:asm:9.7'
    windowFocusAgentLwjgl331 'org.lwjgl:lwjgl-glfw:3.3.1'
    windowFocusAgentLwjgl333 'org.lwjgl:lwjgl-glfw:3.3.3'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.client.mixins.json"
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.register('windowFocusAgentSelfTest', JavaExec) {
    dependsOn tasks.named(sourceSets.windowFocusAgent.classesTaskName)
    dependsOn tasks.named(sourceSets.windowFocusAgentTest.classesTaskName)
    classpath = sourceSets.windowFocusAgentTest.runtimeClasspath
    mainClass = 'cn.codex.minecraftbridge.agent.MinecraftWindowFocusAgentSelfTest'
    doFirst {
        args configurations.windowFocusAgentLwjgl331.singleFile.absolutePath,
            configurations.windowFocusAgentLwjgl333.singleFile.absolutePath
    }
}

tasks.register('windowFocusAgentJar', Jar) {
    dependsOn tasks.named(sourceSets.windowFocusAgent.classesTaskName)
    archiveFileName = 'MinecraftCodexWindowFocusAgent.jar'
    destinationDirectory = layout.buildDirectory.dir('focus-agent')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.windowFocusAgent.output
    from {
        configurations.windowFocusAgentRuntimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
    manifest {
        attributes([
            'Premain-Class': 'cn.codex.minecraftbridge.agent.MinecraftWindowFocusAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false',
            'Implementation-Title': 'Minecraft Codex Window Focus Agent',
            'Implementation-Version': '3',
        ])
    }
}

tasks.named('check').configure { dependsOn tasks.named('windowFocusAgentSelfTest') }
tasks.named('build').configure { dependsOn tasks.named('windowFocusAgentJar') }

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': "${mod_id}.mixins.json,${mod_id}.client.mixins.json",
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    if (project.hasProperty('strictWarnings')) {
        // Forge and Mixin processors intentionally observe, but do not claim,
        // Forge event annotations. Keep every source warning fatal while
        // excluding that javac processor bookkeeping warning.
        options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
    }
}
